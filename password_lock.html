<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
            frame-src 'none';
            form-action 'none';
            font-src 'self' asset:;
            img-src 'self' data:;
            object-src 'none';
            script-src 'self';
            style-src 'self' 'unsafe-inline';"
    />
    <meta charset="utf-8" />
    <title>Fumi Password Lock</title>
    <link href="stylesheets/manifest.css" rel="stylesheet" type="text/css" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-y: auto;
        background: #ffffff;
        color: #242329;
      }

      .password-lock {
        min-height: 100vh;
        padding: 34px 40px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .password-lock__logo {
        margin-bottom: 18px;
        transform: scale(0.7);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.3;
        text-align: center;
      }

      .password-lock__description {
        margin: 10px 0 24px;
        color: #686570;
        font-size: 14px;
        line-height: 1.45;
        text-align: center;
      }

      .password-lock__description--setup {
        width: 100%;
        text-align: left;
        white-space: pre-line;
      }

      form {
        width: 100%;
      }

      label {
        display: block;
        margin: 0 0 7px;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        width: 100%;
        height: 42px;
        margin: 0 0 16px;
        padding: 0 12px;
        border: 1px solid #b6b6b6;
        border-radius: 8px;
        background: #ffffff;
        color: #242329;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: light-dark(#6941c6, #b69ae8);
        box-shadow: 0 0 0 2px light-dark(#f0e9fa, #302640);
      }

      .password-lock__error {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.4;
      }

      .password-lock__error {
        color: #b3261e;
      }

      button {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 8px;
        background: #6941c6;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      button:not(:disabled):hover {
        background: light-dark(#5b36b2, #7950d4);
      }

      button:not(:disabled):active {
        background: light-dark(#4c2d96, #5b36b2);
      }

      button:focus-visible {
        outline: 2px solid light-dark(#6941c6, #b69ae8);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #18181b;
          color: #f2f2f5;
        }

        .password-lock__description {
          color: #adaab5;
        }

        input {
          border-color: #606060;
          background: #29292e;
          color: #f2f2f5;
        }

        .password-lock__error {
          color: #ffb4ab;
        }
      }
    </style>
  </head>
  <body>
    <main class="password-lock">
      <div
        class="password-lock__logo module-splash-screen__logo module-splash-screen__logo--128"
        aria-hidden="true"
      ></div>
      <h1 id="title"></h1>
      <p id="description" class="password-lock__description"></p>
      <form id="form">
        <label id="password-label" for="password"></label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          maxlength="1024"
          required
        />
        <div id="confirmation-group" hidden>
          <label id="confirmation-label" for="confirmation"></label>
          <input
            id="confirmation"
            type="password"
            autocomplete="new-password"
            maxlength="1024"
          />
        </div>
        <p id="error" class="password-lock__error" role="alert" hidden></p>
        <button id="submit" type="submit"></button>
      </form>
    </main>
    <script type="module" src="bundles/dom/passwordLock.js"></script>
  </body>
</html>
